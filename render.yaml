services:
  - type: web
    name: assetra-backend
    runtime: node
    rootDir: backend
    plan: free
    autoDeploy: true
    buildCommand: npm install && npm run prisma:push && npm run prisma:generate
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: MAX_UPLOAD_FILE_BYTES
        value: "838860800"
      - key: MAX_UPLOAD_FILES
        value: "6"
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_DEV_ETHEREAL
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: NOTIFICATION_EMAILS_ENABLED
        value: "true"
      - key: EVENT_BROKER_DRIVER
        value: rabbitmq
      - key: RABBITMQ_URL
        sync: false
      - key: INTEGRATION_API_KEY
        sync: false
  - type: worker
    name: assetra-events-worker
    runtime: node
    rootDir: backend
    plan: free
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm run worker:events
    envVars:
      - key: NODE_ENV
        value: production
      - key: EVENT_BROKER_DRIVER
        value: rabbitmq
      - key: RABBITMQ_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_DEV_ETHEREAL
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: NOTIFICATION_EMAILS_ENABLED
        value: "true"
