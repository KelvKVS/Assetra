events {
    worker_connections 1024;
}

http {
    upstream backend_servers {
        # O Docker DNS resolve 'backend' para todos os IPs das réplicas
        server backend:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Mostrar qual réplica respondeu nos cabeçalhos (opcional, já adicionamos no server.js)
            add_header X-Proxy-Source "Nginx-LoadBalancer";
        }

        # Status do Nginx (opcional para demonstrar escalabilidade)
        location /nginx_status {
            stub_status on;
            access_log off;
            allow all;
        }
    }
}
